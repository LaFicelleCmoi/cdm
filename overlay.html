<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay scores live — CDM 2026 (OBS)</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #fbc531; --red: #ff4757; --green: #2ed573; --white: #f2f6fa;
    --bg: #0b1117;
    --font-d: 'Bebas Neue', Impact, sans-serif;
    --font-b: 'Inter', system-ui, sans-serif;
  }
  /* Fond TRANSPARENT : indispensable pour OBS (Browser Source) */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: var(--font-b); -webkit-font-smoothing: antialiased; }

  /* Conteneur ancré dans un coin (réglable via ?pos=) — colonne : scorebug puis feed dessous */
  #bug { position: fixed; display: inline-flex; flex-direction: column; gap: 6px; transform-origin: top left; }
  #bug.top-left     { top: 18px; left: 18px; align-items: flex-start; transform-origin: top left; }
  #bug.top-right    { top: 18px; right: 18px; align-items: flex-end; transform-origin: top right; }
  #bug.bottom-left  { bottom: 18px; left: 18px; align-items: flex-start; transform-origin: bottom left; }
  #bug.bottom-right { bottom: 18px; right: 18px; align-items: flex-end; transform-origin: bottom right; }

  .scorebug {
    display: inline-flex; align-items: stretch;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-top: 3px solid var(--gold);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);
    opacity: 0; transform: translateY(-8px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .scorebug.show { opacity: 1; transform: translateY(0); }
  .scorebug.state-in { border-top-color: var(--red); }
  .scorebug.state-post { border-top-color: var(--green); }
  .scorebug.delayed { border-top-color: #f9a825; }

  .sb-team { display: flex; align-items: center; gap: 9px; padding: 9px 13px; }
  .sb-team.rev { flex-direction: row-reverse; }
  .sb-logo { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5)); }
  .sb-abbr { font-size: 18px; font-weight: 800; letter-spacing: 0.04em; color: var(--white); }
  /* Rappel cartons jaunes/rouges, par équipe, sous l'abréviation */
  .sb-tcol { display: flex; flex-direction: column; gap: 2px; }
  .sb-team.rev .sb-tcol { align-items: flex-end; }
  .sb-cards { display: none; font-size: 11px; font-weight: 800; line-height: 1; }
  .sb-cards.show { display: flex; gap: 5px; }
  .sb-cards .sc-y { color: #ffcf33; }
  .sb-cards .sc-r { color: var(--red); }

  .sb-score { display: flex; align-items: center; gap: 9px; padding: 6px 15px; background: rgba(0,0,0,0.32); font-family: var(--font-d); font-size: 32px; line-height: 1; color: #fff; }
  .sb-score .v { min-width: 18px; text-align: center; transition: transform .3s, color .3s; }
  .sb-score .v.bump { animation: bump .6s cubic-bezier(.34,1.56,.64,1); }
  .scorebug.state-in .sb-score .v { color: #fff; }
  .sb-sep { opacity: .35; }
  .sb-comp { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
  @keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.5); color:var(--gold)} 100%{transform:scale(1)} }

  .sb-status { display: flex; align-items: center; gap: 5px; padding: 9px 14px; font-size: 15px; font-weight: 800; letter-spacing: 0.02em; color: var(--white); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .sb-status.delayed { color: #f9a825; }
  .sb-add { color: var(--green); background: rgba(46,213,115,0.16); border-radius: 4px; padding: 0 5px; font-weight: 800; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,71,87,.5)} 50%{box-shadow:0 0 0 6px rgba(255,71,87,0)} }

  /* Flash "BUT !" quand un score augmente */
  .scorebug.goal { animation: goalflash 1.1s ease; }
  @keyframes goalflash { 0%,100%{box-shadow:0 8px 28px rgba(0,0,0,.55)} 30%{box-shadow:0 0 0 3px var(--gold), 0 8px 34px rgba(251,197,49,.6)} }

  .sb-extra { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.45); padding: 9px 11px; align-self: center; }

  /* Liste des événements (buteurs / cartons / penalty) sous le scorebug */
  .sb-feed {
    display: inline-flex; flex-direction: column; align-items: flex-start; gap: 4px;
    background: var(--bg); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 7px 12px; max-width: 100%;
    opacity: 0; transform: translateY(-6px); transition: opacity .3s, transform .3s;
    font-size: 14px; font-weight: 700; color: var(--white);
  }
  .sb-feed.show { opacity: 1; transform: translateY(0); }
  .sb-feed.flash { animation: feedflash 1.2s ease; }
  @keyframes feedflash { 0%,100%{ box-shadow:0 0 0 0 rgba(251,197,49,0) } 30%{ box-shadow:0 0 0 3px var(--gold) } }
  .fe-row { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sb-feed .fe-emoji { font-size: 16px; }
  .sb-feed .fe-clock { color: var(--gold); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 34px; }
  .fe-row.red .fe-clock { color: var(--red); }
  .sb-feed.cooling { border-color: rgba(56,189,248,0.45); }
  .sb-feed.cooling .fe-player { color: #7fdbff; }
  .sb-feed .fe-team { color: #cdd9e6; font-weight: 800; letter-spacing: .02em; }
  .sb-feed .fe-player { color: #fff; }
  .sb-feed .fe-tag { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: .04em; }
  /* Séance de tirs au but */
  .sb-feed.shootout { align-items: stretch; gap: 6px; }
  .so-tracker { display: flex; flex-direction: column; gap: 5px; }
  .so-row { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .so-flag { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .so-abbr { font-weight: 800; min-width: 36px; letter-spacing: .03em; color: var(--white); }
  .so-score { font-weight: 800; min-width: 16px; text-align: center; color: var(--gold); font-variant-numeric: tabular-nums; }
  .so-cells { display: inline-flex; gap: 3px; margin-left: 3px; }
  .so-cell { width: 17px; height: 17px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; line-height: 1; }
  .so-cell.scored { background: #1f9d57; color: #fff; }
  .so-cell.missed { background: var(--red); color: #fff; }
  .so-cell.pending { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); }
  .so-row.win .so-abbr, .so-row.win .so-score { color: #34d36b; }
  /* Célébration de but « BUT ! » */
  #goal-cele-layer { position: fixed; inset: 0; z-index: 9500; pointer-events: none; display: flex; align-items: flex-start; justify-content: center; overflow: hidden; }
  .gc-card { --tc: #fbc531; margin-top: 14vh; min-width: 250px; max-width: 92vw; padding: 18px 32px 20px; border-radius: 22px; text-align: center; background: linear-gradient(180deg, rgba(14,20,28,0.97), rgba(8,12,18,0.99)); border: 2px solid var(--tc); box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 50px -8px var(--tc), inset 0 0 46px -24px var(--tc); opacity: 0; transform: translateY(-26px) scale(0.82); }
  .gc-card.in { animation: gcIn 0.55s cubic-bezier(.18,.9,.28,1.3) forwards; }
  .gc-card.out { animation: gcOut 0.5s ease forwards; }
  @keyframes gcIn { 0% { opacity: 0; transform: translateY(-26px) scale(.82); } 60% { opacity: 1; } 100% { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes gcOut { to { opacity: 0; transform: translateY(-18px) scale(.92); } }
  .gc-burst { font-size: 1.9em; line-height: 1; animation: gcPop .6s ease .08s both; }
  @keyframes gcPop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  .gc-headline { font-family: var(--font-d); font-size: clamp(2.2em, 7vw, 3.2em); line-height: 1; letter-spacing: .06em; margin: 2px 0 9px; background: linear-gradient(180deg, #fff, var(--tc)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .gc-team { display: flex; align-items: center; justify-content: center; gap: 9px; margin-bottom: 5px; }
  .gc-flag { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,.55); }
  .gc-abbr { font-family: var(--font-d); font-size: 1.3em; letter-spacing: .08em; color: var(--tc); }
  .gc-scorer { font-weight: 800; font-size: 1.1em; color: #fff; margin: 2px 0 10px; }
  .gc-min { color: #8a9bb0; font-weight: 700; margin-left: 4px; }
  .gc-score { display: flex; align-items: center; justify-content: center; gap: 7px; font-family: var(--font-d); font-size: 1.7em; color: #fff; }
  .gc-score i { color: #8a9bb0; font-style: normal; margin: 0 3px; }
  .gc-score span { color: #8a9bb0; font-size: .6em; letter-spacing: .06em; }
</style>
</head>
<body>
<div id="bug"></div>

<script>
/* ============================================================
   Overlay OBS — scores en direct Coupe du Monde 2026
   Source ESPN (non officielle). Autonome, fond transparent.

   À utiliser dans OBS → Source "Navigateur" (Browser Source) :
   - URL : .../overlay.html
   - Largeur ~480, Hauteur ~120, fond transparent (par défaut)

   Options via l'URL :
   - ?pos=top-left | top-right | bottom-left | bottom-right   (défaut top-left)
   - ?team=France        → épingle le match d'une équipe précise
   - ?scale=1.3          → agrandit / réduit l'overlay
   - ?hideEmpty=1        → cache tout s'il n'y a aucun match
   Exemples :
     overlay.html?team=France&pos=top-right
     overlay.html?scale=1.4&pos=bottom-left
   ============================================================ */
(function () {
  const ENDPOINT = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard';
  const P = new URLSearchParams(location.search);
  const POS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'].includes(P.get('pos')) ? P.get('pos') : 'top-left';
  const TEAM = (P.get('team') || '').trim().toLowerCase();
  const SCALE = Math.min(3, Math.max(0.5, parseFloat(P.get('scale')) || 1));
  const HIDE_EMPTY = P.get('hideEmpty') === '1';
  const REFRESH_MS = 15000;   // rafraîchissement scores
  const ROTATE_MS = 10000;    // rotation entre matchs en direct

  const bug = document.getElementById('bug');
  bug.className = POS;
  bug.style.transform = `scale(${SCALE})`;

  let liveList = [], rotateIdx = 0, rotateTimer = null;
  const lastScore = {}; // id -> "h-a"

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tmo = (ms) => { try { return AbortSignal.timeout(ms); } catch (e) { return undefined; } }; // timeout fetch sûr
  const parisTime = (iso) => { try { return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }); } catch (e) { return ''; } };
  const abbr = (c) => (c && c.team && (c.team.abbreviation || c.team.shortDisplayName)) || '—';
  const logo = (c) => (c && c.team && c.team.logo) || '';
  // Met en valeur le temps additionnel : "90'+3'" -> "90'" + pastille verte "+3'"
  const clockHTML = (txt) => {
    const m = String(txt == null ? '' : txt).match(/^(.*?)(\+\s*\d+'?)\s*$/);
    if (!m) return esc(txt);
    return `${esc(m[1].trim())}<span class="sb-add">${esc(m[2].replace(/\s+/g, ''))}</span>`;
  };
  const matchesTeam = (ev) => {
    if (!TEAM) return true;
    return (ev.competitions[0].competitors || []).some(c => {
      const t = c.team || {};
      return [t.displayName, t.shortDisplayName, t.abbreviation, t.name, t.location]
        .filter(Boolean).some(n => n.toLowerCase().includes(TEAM));
    });
  };

  // Logo de la compétition (FIFA World Cup) servi par ESPN — variante claire pour fond sombre
  const COMP_LOGO = 'https://a.espncdn.com/i/leaguelogos/soccer/500-dark/4.png';

  /* ---- Événements du match (buteurs/cartons/penalty) — inline, autonome ---- */
  const SUMMARY = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=';
  const evCache = {}; // id -> {ts, list}
  const feedSig = {}; // id -> signature du dernier event affiché (flash sur nouveauté)
  const FEED_EMOJI = { goal: '⚽', pen: '⚽', freekick: '⚽', owngoal: '⚽', penmiss: '❌', red: '🟥', yellow: '🟨' };
  const FEED_TAG = { pen: 'PEN', freekick: 'CF', owngoal: 'CSC', penmiss: 'PEN ✗' };
  function evKind(t) {
    if (!t) return 'other';
    if (t === 'Own Goal') return 'owngoal';
    if (/penalty/i.test(t) && /miss|saved/i.test(t)) return 'penmiss';
    if (/penalty/i.test(t) && /scor/i.test(t)) return 'pen';
    if (/free.?kick/i.test(t)) return 'freekick';
    if (/^goal/i.test(t)) return 'goal';
    if (/red/i.test(t)) return 'red';
    if (/yellow/i.test(t)) return 'yellow';
    return 'other';
  }
  const lastName = (f) => { if (!f) return ''; const p = f.trim().split(/\s+/); return p.length > 1 ? p.slice(1).join(' ') : f; };
  async function fetchEv(id) {
    const c = evCache[id];
    if (c && Date.now() - c.ts < 20000) return c.list;
    try {
      const r = await fetch(SUMMARY + id, { cache: 'no-store', signal: tmo(8000) });
      if (!r.ok) throw 0;
      const d = await r.json();
      const ke = d.keyEvents || [];
      // Pause fraîcheur en cours : dernier "drinks break" non suivi d'un "End Delay"
      let lastC = -1, lastE = -1;
      ke.forEach((k, i) => {
        const tp = (k.type || {}).text || '', tx = k.text || '';
        if (/start delay/i.test(tp) && /drink|cool|water|hydrat/i.test(tx)) lastC = i;
        else if (/end delay/i.test(tp)) lastE = i;
      });
      const cooling = lastC > lastE;
      const list = ke.map(k => ({
        kind: evKind((k.type || {}).text),
        clock: (k.clock || {}).displayValue || '',
        player: ((k.participants || [])[0] || {}).athlete ? k.participants[0].athlete.displayName : '',
        team: (k.team || {}).displayName || '',
      })).filter(e => FEED_EMOJI[e.kind]);
      evCache[id] = { ts: Date.now(), list, cooling };
      return list;
    } catch (e) { return (c && c.list) || []; }
  }

  // === Célébration de but « BUT ! » (carte animée teintée à la nation marqueuse) ===
  const GOAL_KINDS = ['goal', 'pen', 'freekick', 'owngoal'];
  const GoalCele = (() => {
    let layer = null, queue = [], showing = false;
    const escc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    function ensureLayer() {
      if (!layer) { layer = document.createElement('div'); layer.id = 'goal-cele-layer'; document.body.appendChild(layer); }
      return layer;
    }
    function next() {
      if (showing || !queue.length) return;
      showing = true;
      const g = queue.shift();
      const color = g.color ? (String(g.color)[0] === '#' ? g.color : '#' + g.color) : '#fbc531';
      const flag = g.logo ? `<img class="gc-flag" src="${escc(g.logo)}" alt="" onerror="this.style.display='none'">` : '';
      const min = g.minute ? `<span class="gc-min">${escc(g.minute)}</span>` : '';
      const scorer = g.scorer ? `<div class="gc-scorer">${escc(g.scorer)} ${min}</div>` : '';
      const card = document.createElement('div');
      card.className = 'gc-card';
      card.style.setProperty('--tc', color);
      card.innerHTML =
        `<div class="gc-burst">⚽</div>` +
        `<div class="gc-headline">BUT !</div>` +
        `<div class="gc-team">${flag}<span class="gc-abbr">${escc(g.abbr || '')}</span></div>` +
        scorer +
        `<div class="gc-score"><span>${escc(g.homeAbbr || '')}</span> <b>${escc(g.hs)}</b><i>–</i><b>${escc(g.as)}</b> <span>${escc(g.awayAbbr || '')}</span></div>`;
      ensureLayer().appendChild(card);
      void card.offsetWidth; card.classList.add('in');
      setTimeout(() => {
        card.classList.remove('in'); card.classList.add('out');
        setTimeout(() => { card.remove(); showing = false; next(); }, 600);
      }, 4600);
    }
    return { show(g) { queue.push(g); next(); } };
  })();
  // Prévisualisation : taper goalCeleDemo() dans la console (ou OBS → Interagir).
  window.goalCeleDemo = (o) => GoalCele.show(Object.assign({ abbr: 'NOR', color: 'ba0c2f', logo: 'https://a.espncdn.com/i/teamlogos/countries/500/nor.png', scorer: 'Haaland', minute: "86'", homeAbbr: 'CIV', awayAbbr: 'NOR', hs: 1, as: 2 }, o || {}));
  // Récupère le buteur + la minute via les événements du match, puis affiche la carte.
  async function celebrateGoal(scorerComp, hs, as, homeAbbr, awayAbbr, evId) {
    const team = (scorerComp && scorerComp.team) || {};
    let scorer = '', minute = '';
    try {
      const list = await fetchEv(evId);
      const goals = (list || []).filter(e => GOAL_KINDS.includes(e.kind));
      const mine = goals.filter(e => e.team === team.displayName);
      const g = mine.length ? mine[mine.length - 1] : goals[goals.length - 1];
      if (g) { scorer = lastName(g.player); minute = g.clock; }
    } catch (e) {}
    GoalCele.show({
      abbr: team.abbreviation || (team.displayName || '').slice(0, 3).toUpperCase(),
      color: team.color, logo: team.logo, scorer, minute, hs, as, homeAbbr, awayAbbr
    });
  }
  // Quel(s) côté(s) viennent de marquer (augmentation numérique du score)
  function goalSides(prevKey, ch, ca) {
    const p = (prevKey || '').split('-'); const ph = parseInt(p[0]), pa = parseInt(p[1]);
    const sides = [];
    if (!isNaN(ph) && parseInt(ch) > ph) sides.push('home');
    if (!isNaN(pa) && parseInt(ca) > pa) sides.push('away');
    return sides;
  }

  function feedEl() {
    let f = bug.querySelector('.sb-feed');
    if (!f) { f = document.createElement('div'); f.className = 'sb-feed'; bug.appendChild(f); }
    return f;
  }
  function clearCards() {
    bug.querySelectorAll('.sb-cards').forEach(s => { s.innerHTML = ''; s.classList.remove('show'); });
  }
  // Rappel cartons jaunes/rouges par équipe sous chaque équipe du scorebug
  function paintCards(list, ev) {
    const cs = ev.competitions[0].competitors || [];
    const home = cs.find(c => c.homeAway === 'home') || cs[0];
    const away = cs.find(c => c.homeAway === 'away') || cs[1];
    const tally = {};
    (list || []).forEach(e => {
      if (e.kind !== 'yellow' && e.kind !== 'red') return;
      (tally[e.team || ''] = tally[e.team || ''] || { yellow: 0, red: 0 })[e.kind]++;
    });
    const fill = (side, comp) => {
      const span = bug.querySelector(`.sb-cards[data-side="${side}"]`);
      if (!span) return;
      const nm = comp && comp.team && comp.team.displayName;
      const c = (nm && tally[nm]) || { yellow: 0, red: 0 };
      let h = '';
      if (c.yellow) h += `<span class="sc-y">🟨${c.yellow > 1 ? '×' + c.yellow : ''}</span>`;
      if (c.red) h += `<span class="sc-r">🟥${c.red > 1 ? '×' + c.red : ''}</span>`;
      span.innerHTML = h;
      span.classList.toggle('show', !!h);
    };
    fill('home', home);
    fill('away', away);
  }

  // Abréviation de l'équipe d'un événement (via les compétiteurs du match)
  function teamAbbrOf(ev, teamName) {
    if (!teamName) return '';
    const c = (ev.competitions[0].competitors || []).find(x => x.team && x.team.displayName === teamName);
    return c ? (c.team.abbreviation || c.team.shortDisplayName || '') : '';
  }

  // Expiration des événements : un événement reste ~1 min sur l'overlay (à partir du
  // moment où l'overlay le voit), puis disparaît. Le rappel cartons par équipe, lui,
  // reste cumulatif (non concerné).
  const FEED_TTL = 60000;   // 1 minute
  const _feedSeen = {};     // clé événement -> 1er affichage (ms)
  let _feedCur = null;      // { ev, list } courant, pour l'élagage entre deux fetchs
  function recentEvents(evId, list) {
    const now = Date.now();
    return (list || []).filter(it => {
      const k = `${evId}|${it.kind}|${it.clock}|${it.player}`;
      if (_feedSeen[k] == null) _feedSeen[k] = now;
      return now - _feedSeen[k] <= FEED_TTL;
    });
  }
  function feedRowsHTML(ev, items) {
    return items.slice().reverse().map(it => {
      const ab = teamAbbrOf(ev, it.team);
      const teamTag = ab ? `<span class="fe-team">${esc(ab)}</span>` : '';
      const tg = FEED_TAG[it.kind] ? `<span class="fe-tag">${FEED_TAG[it.kind]}</span>` : '';
      return `<div class="fe-row${it.kind === 'red' ? ' red' : ''}"><span class="fe-emoji">${FEED_EMOJI[it.kind]}</span><span class="fe-clock">${esc(it.clock)}</span>${teamTag}<span class="fe-player">${esc(lastName(it.player))}</span>${tg}</div>`;
    }).join('');
  }

  // === Tirs au but : ESPN expose chaque tir dans competitions[0].details (shootout:true,
  // scoringPlay = marqué/raté, team + tireur), dans l'ordre alterné. On reconstruit par équipe. ===
  function shootoutData(ev) {
    const comp = ev.competitions[0];
    const cs = comp.competitors || [];
    if (!cs.some(c => c.shootoutScore != null)) return null; // pas de séance
    const home = cs.find(c => c.homeAway === 'home') || cs[0];
    const away = cs.find(c => c.homeAway === 'away') || cs[1];
    const homeId = home.team.id, awayId = away.team.id;
    const seq = {}; seq[homeId] = []; seq[awayId] = [];
    // ESPN ne liste QUE les tirs marqués → on reconstitue les ratés via les « trous »
    // dans l'alternance (un tir omis = raté). Gère aussi les ratés explicites.
    const dets = (comp.details || [])
      .filter(d => d && d.shootout && d.team && (d.team.id === homeId || d.team.id === awayId))
      .map(d => ({ team: d.team.id, scored: !!d.scoringPlay && !/miss|saved|fail/i.test((d.type && d.type.text) || '') }));
    if (dets.length) {
      const order = [dets[0].team, dets[0].team === homeId ? awayId : homeId];
      let di = 0, kn = 0, guard = 0;
      while (di < dets.length && guard++ < 40) {
        const expected = order[kn % 2];
        if (dets[di].team === expected) { seq[expected].push(dets[di].scored); di++; }
        else seq[expected].push(false); // tir omis par ESPN = raté
        kn++;
      }
    }
    const mk = (c) => ({ abbr: abbr(c), logo: logo(c), so: (c.shootoutScore != null ? c.shootoutScore : 0), kicks: seq[c.team.id] || [], winner: c.winner === true });
    return { home: mk(home), away: mk(away) };
  }
  function soRow(t, slots) {
    let cells = '';
    for (let i = 0; i < slots; i++) {
      cells += i < t.kicks.length
        ? (t.kicks[i] ? '<span class="so-cell scored">O</span>' : '<span class="so-cell missed">✗</span>')
        : `<span class="so-cell pending">${i + 1}</span>`;
    }
    const flag = t.logo ? `<img class="so-flag" src="${t.logo}" alt="">` : '<span class="so-flag"></span>';
    return `<div class="so-row${t.winner ? ' win' : ''}">${flag}<span class="so-abbr">${esc(t.abbr)}</span><span class="so-score">${esc(t.so)}</span><span class="so-cells">${cells}</span></div>`;
  }
  function renderShootout(so) {
    const slots = Math.max(5, so.home.kicks.length, so.away.kicks.length); // 5 + mort subite
    const el = feedEl();
    el.className = 'sb-feed show shootout';
    el.innerHTML = `<div class="so-tracker">${soRow(so.home, slots)}${soRow(so.away, slots)}</div>`;
  }

  // Affiche les événements notables récents (< 1 min) sous le score + l'équipe du joueur
  async function updateFeed(ev) {
    const f = bug.querySelector('.sb-feed');
    const state = ev && ev.competitions[0].status.type.state;
    if (!ev || state === 'pre') { if (f) f.classList.remove('show'); clearCards(); _feedCur = null; return; }
    const list = await fetchEv(ev.id);
    paintCards(list, ev); // rappel cartons par équipe (liste complète, cumulatif)
    // Séance de tirs au but en cours/terminée → tracker dédié (prioritaire)
    const so = shootoutData(ev);
    if (so) { renderShootout(so); _feedCur = null; return; }
    // Pause fraîcheur en cours → encart spécial prioritaire
    if ((evCache[ev.id] || {}).cooling) {
      const el = feedEl();
      el.className = 'sb-feed show cooling';
      el.innerHTML = `<div class="fe-row"><span class="fe-emoji">💧</span><span class="fe-player">Pause fraîcheur</span></div>`;
      _feedCur = null;
      return;
    }
    _feedCur = { ev, list };
    const recent = recentEvents(ev.id, list); // ne garde que ce qui a < 1 min
    if (!recent.length) { if (f) f.classList.remove('show'); return; }
    const el = feedEl();
    const newest = list[list.length - 1];
    const sig = `${newest.kind}|${newest.clock}|${newest.player}`;
    const isNew = feedSig[ev.id] && feedSig[ev.id] !== sig;
    el.innerHTML = feedRowsHTML(ev, recent);
    el.className = 'sb-feed show list';
    if (isNew) { void el.offsetWidth; el.classList.add('flash'); }
    feedSig[ev.id] = sig;
  }

  // Élagage régulier : retire les événements de plus d'1 min même sans nouveau fetch.
  setInterval(() => {
    if (!_feedCur) return;
    const f = bug.querySelector('.sb-feed');
    if (!f || !f.classList.contains('list')) return; // épargne l'encart « pause fraîcheur »
    const recent = recentEvents(_feedCur.ev.id, _feedCur.list);
    if (!recent.length) { f.classList.remove('show'); _feedCur = null; return; }
    f.innerHTML = feedRowsHTML(_feedCur.ev, recent);
  }, 5000);

  function render(ev) {
    if (!ev) { bug.querySelector('.scorebug')?.classList.remove('show'); bug.querySelector('.sb-feed')?.classList.remove('show'); if (HIDE_EMPTY) bug.innerHTML = ''; return; }
    const comp = ev.competitions[0];
    const t = comp.status.type;
    const state = t.state; // pre | in | post
    const cs = comp.competitors || [];
    const home = cs.find(c => c.homeAway === 'home') || cs[0];
    const away = cs.find(c => c.homeAway === 'away') || cs[1];
    const hs = state === 'pre' ? '–' : (home && home.score !== undefined ? home.score : '–');
    const as = state === 'pre' ? '–' : (away && away.score !== undefined ? away.score : '–');

    // Match interrompu : ESPN garde state="in" mais name=STATUS_DELAYED/SUSPENDED/ABANDONED
    const interrupted = state === 'in' && /delay|suspend|abandon|interrupt|postpon/i.test((t.name || '') + ' ' + (t.description || ''));
    const statusTxt = interrupted ? '⏸ Interrompu'
                    : state === 'in' ? (comp.status.displayClock || t.shortDetail || 'LIVE')
                    : state === 'post' ? (t.shortDetail || 'FT')
                    : parisTime(ev.date);
    const statusCls = interrupted ? 'delayed' : state === 'in' ? 'live' : state === 'post' ? 'post' : 'pre';

    let card = bug.querySelector('.scorebug');
    const fresh = !card || card.dataset.id !== ev.id;
    if (fresh) {
      if (card) card.remove();
      card = document.createElement('div');
      card.className = `scorebug state-${state}${interrupted ? ' delayed' : ''}`;
      card.dataset.id = ev.id;
      card.innerHTML = `
          <div class="sb-status ${statusCls}">${clockHTML(statusTxt)}</div>
          <div class="sb-team">
            ${logo(home) ? `<img class="sb-logo" src="${logo(home)}" alt="">` : ''}
            <span class="sb-tcol"><span class="sb-abbr">${esc(abbr(home))}</span><span class="sb-cards" data-side="home"></span></span>
          </div>
          <div class="sb-score">
            <span class="v" data-s="h">${esc(hs)}</span><img class="sb-comp" src="${COMP_LOGO}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="sb-sep" style="display:none">–</span><span class="v" data-s="a">${esc(as)}</span>
          </div>
          <div class="sb-team rev">
            ${logo(away) ? `<img class="sb-logo" src="${logo(away)}" alt="">` : ''}
            <span class="sb-tcol"><span class="sb-abbr">${esc(abbr(away))}</span><span class="sb-cards" data-side="away"></span></span>
          </div>`;
      bug.insertBefore(card, bug.firstChild); // scorebug en premier (le feed reste sous, ou au-dessus en bas via CSS)
      requestAnimationFrame(() => card.classList.add('show'));
    } else {
      // mise à jour en place (pas de re-création → pas de clignotement)
      card.className = `scorebug show state-${state}${interrupted ? ' delayed' : ''}`;
      card.querySelector('[data-s="h"]').textContent = hs;
      card.querySelector('[data-s="a"]').textContent = as;
      const st = card.querySelector('.sb-status');
      st.className = `sb-status ${statusCls}`;
      st.innerHTML = clockHTML(statusTxt); // clockHTML échappe + colore le temps additionnel
    }

    // détection de but → flash + bump
    const key = `${hs}-${as}`;
    if (state === 'in' && lastScore[ev.id] && lastScore[ev.id] !== key) {
      card.classList.remove('goal'); void card.offsetWidth; card.classList.add('goal');
      card.querySelectorAll('.v').forEach(v => { v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump'); });
      goalSides(lastScore[ev.id], hs, as).forEach(side => celebrateGoal(side === 'home' ? home : away, hs, as, abbr(home), abbr(away), ev.id)); // carte « BUT ! »
    }
    lastScore[ev.id] = key;

    updateFeed(ev); // buteurs / cartons / penalty sous le score
  }

  function pickAndRender(events) {
    const evs = (events || []).filter(e => e && e.competitions && e.competitions[0] && e.competitions[0].status && e.competitions[0].status.type).filter(matchesTeam);
    if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }

    const live = evs.filter(e => e.competitions[0].status.type.state === 'in');
    if (live.length) {
      if (rotateIdx >= live.length) rotateIdx = 0;
      liveList = live;
      render(live[rotateIdx]);
      if (live.length > 1 && !TEAM) {
        rotateTimer = setInterval(() => { try { rotateIdx = (rotateIdx + 1) % live.length; render(live[rotateIdx]); } catch (e) {} }, ROTATE_MS);
      }
      return;
    }
    // pas de live → prochain match (ou dernier terminé si team épinglée), sinon rien
    const order = { pre: 0, post: 1 };
    const rest = evs.filter(e => e.competitions[0].status.type.state !== 'in')
      .sort((a, b) => new Date(a.date) - new Date(b.date));
    const upcoming = rest.find(e => e.competitions[0].status.type.state === 'pre');
    const lastPost = [...rest].reverse().find(e => e.competitions[0].status.type.state === 'post');
    render(upcoming || (TEAM ? lastPost : null) || null);
  }

  async function tick() {
    try {
      const res = await fetch(ENDPOINT, { cache: 'no-store', signal: tmo(8000) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      pickAndRender(data.events || []);
    } catch (e) { /* garde le dernier affichage */ }
  }

  tick();
  setInterval(tick, REFRESH_MS);
})();
</script>
